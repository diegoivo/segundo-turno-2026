# Coletor do 2o turno 2026. Conta Cloudflare: Hosts@conversion.com.br (escolhida pelo Diego em 24/10).
# NAO faca deploy sem revisar: production grava no bucket oficial.
name = "segundo-turno-coletor"
main = "src/index.mjs"
account_id = "7da0ed9efd4c11dde93580a34322e913"
compatibility_date = "2025-10-01"
workers_dev = false

# ---------- staging ----------
[env.staging]
name = "segundo-turno-coletor-staging"
workers_dev = true   # endpoint HTTP de coleta manual (protegido por token)

[env.staging.vars]
ENV = "staging"
# Metodo do presidente: "com_correcao" (padrao) | "sem_correcao". Trocar = so redeploy/dashboard.
MODELO_METODO_PRESIDENTE = "com_correcao"

[env.staging.triggers]
crons = ["* * * * *"]

[[env.staging.r2_buckets]]
binding = "DATA"
bucket_name = "segundo-turno-staging"

# Secret do endpoint manual (nao fica no arquivo):
#   wrangler secret put STAGING_TOKEN --env staging

# ---------- production ----------
[env.production]
name = "segundo-turno-coletor"
workers_dev = false  # sem rota publica: o Worker responde 404 a qualquer HTTP

[env.production.vars]
ENV = "production"
MODELO_METODO_PRESIDENTE = "com_correcao"  # ou "sem_correcao" (interruptor operacional)
# A cadeia so comeca com dado do TSE gerado nesta data ou depois, com secoes totalizadas > 0.
START_DATE = "2026-10-25"

[env.production.triggers]
crons = ["* * * * *"]

[[env.production.r2_buckets]]
binding = "DATA"
bucket_name = "segundo-turno-prod"

# ---------- ensaio geral (TSE falso + bucket proprio; ENV=staging: production exige o TSE oficial e barra dados sinteticos) ----------
[env.ensaio]
name = "segundo-turno-coletor-ensaio"
workers_dev = false  # sem HTTP publico

[env.ensaio.vars]
ENV = "staging"
MODELO_METODO_PRESIDENTE = "com_correcao"
START_DATE = "2026-10-25"
# Base do TSE falso do ensaio (Worker segundo-turno-tse-ensaio); sem esta var o coletor usa o TSE oficial.
TSE_BASE = "https://segundo-turno-tse-ensaio.hosts5924.workers.dev/oficial/ele2026"

[env.ensaio.triggers]
# Cron desligado: o worker do ensaio liga (["* * * * *"]) ao iniciar o ensaio.
crons = []

[[env.ensaio.r2_buckets]]
binding = "DATA"
bucket_name = "segundo-turno-ensaio2"
